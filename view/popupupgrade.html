<div class="popupupgrade-overlay" id="popupupgrade-overlay" aria-hidden="true">
    <div class="popupupgrade" role="dialog" aria-modal="true" aria-labelledby="popupupgrade-title">
        <button type="button" class="popupupgrade__close" id="popupupgrade-close" aria-label="Close">
            <img src="/assets/image/popuplogin/icon_close.png" alt="">
        </button>

        <header class="popupupgrade__header">
            <img class="popupupgrade__logo" src="/assets/image/common/icon_logo.png" alt="Ruby Club" id="popupupgrade-title">
            <p class="popupupgrade__domain">
                <span class="popupupgrade__domain-bg" aria-hidden="true"></span>
                <span class="popupupgrade__domain-text">Easy link: <strong>h5.rubyclubph.com</strong></span>
            </p>
            <h2 class="popupupgrade__heading">UPGRADE ACCOUNT</h2>
        </header>

        <section class="popupupgrade__panel" aria-label="Upgrade account">
            <div class="popupupgrade__panel-bg" aria-hidden="true"></div>
            <div class="popupupgrade__panel-inner">
                <form class="popupupgrade__form" id="popupupgrade-form">
                    <label class="popupupgrade__field">
                        <span class="popupupgrade__field-bg" aria-hidden="true"></span>
                        <img class="popupupgrade__field-icon" src="/assets/image/popuplogin/icon_acc.png" alt="">
                        <input type="text" class="popupupgrade__input" id="popupupgrade-username" name="userName" placeholder="Username" autocomplete="username" inputmode="text">
                    </label>
                    <label class="popupupgrade__field">
                        <span class="popupupgrade__field-bg" aria-hidden="true"></span>
                        <img class="popupupgrade__field-icon" src="/assets/image/popuplogin/icon_password.png" alt="">
                        <input type="password" class="popupupgrade__input" id="popupupgrade-password" name="password" placeholder="Password" autocomplete="new-password">
                        <button type="button" class="popupupgrade__toggle-pass" id="popupupgrade-toggle-password" aria-label="Show password">
                            <img src="/assets/image/popuplogin/icon_hide_pass.png" alt="">
                        </button>
                    </label>
                    <label class="popupupgrade__field">
                        <span class="popupupgrade__field-bg" aria-hidden="true"></span>
                        <img class="popupupgrade__field-icon" src="/assets/image/popuplogin/icon_password.png" alt="">
                        <input type="password" class="popupupgrade__input" id="popupupgrade-confirm-password" name="confirmPassword" placeholder="Re- enter pass" autocomplete="new-password">
                        <button type="button" class="popupupgrade__toggle-pass" id="popupupgrade-toggle-confirm" aria-label="Show confirm password">
                            <img src="/assets/image/popuplogin/icon_hide_pass.png" alt="">
                        </button>
                    </label>

                    <div class="popupupgrade__google-mount" id="popupupgrade-google-mount" aria-label="Link Google account">
                        <button type="button" class="popupupgrade__google" id="popupupgrade-google-btn">
                            <img class="popupupgrade__google-icon" src="/assets/image/popuplogin/icon_logo_google.png" alt="">
                            <span>Link google account</span>
                        </button>
                        <div class="popupupgrade__google-hidden" id="popupupgrade-google-hidden" aria-hidden="true"></div>
                    </div>

                    <button type="submit" class="popupupgrade__submit" id="popupupgrade-submit">
                        <img class="popupupgrade__submit-bg" src="/assets/image/popuplogin/background_button_login.png" alt="">
                        <span class="popupupgrade__submit-label">Confirm</span>
                    </button>
                </form>
            </div>
        </section>

        <footer class="popupupgrade__footer">
            <button type="button" class="popupupgrade__util" id="popupupgrade-support">
                <img src="/assets/image/popuplogin/icon_support.png" alt="">
                <span>SUPPORT 24/7</span>
            </button>
        </footer>
    </div>
</div>
