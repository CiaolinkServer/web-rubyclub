<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Ruby Club - Lobby</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../asset/css/lobby.css">
</head>
<body class="lobby-page">
    <div class="lobby" id="lobby-app">
        <header class="lobby-header">
            <img class="lobby-header__bg" src="../asset/image/lobby/bg_header.png" alt="">
            <div class="lobby-header__inner">
                <div class="lobby-profile">
                    <img class="lobby-profile__avatar" src="../asset/image/lobby/avatar.png" alt="">
                    <div class="lobby-profile__info">
                        <p class="lobby-profile__name" id="lobby-username">Guest</p>
                        <p class="lobby-profile__id" id="lobby-userid">ID —</p>
                    </div>
                </div>

                <div class="lobby-header__actions">
                    <button type="button" class="lobby-header__btn" aria-label="Shop">
                        <img src="../asset/image/lobby/button_shop.png" alt="Shop">
                    </button>
                    <button type="button" class="lobby-header__btn" aria-label="Cashout">
                        <img src="../asset/image/lobby/button_withdraw.png" alt="Cashout">
                    </button>
                </div>

                <div class="lobby-wallet">
                    <button type="button" class="lobby-support" aria-label="Support">
                        <img src="../asset/image/lobby/button_support.png" alt="Support">
                    </button>
                    <div class="lobby-wallet__balance">
                        <img class="lobby-wallet__coin" src="../asset/image/lobby/coin.png" alt="">
                        <span id="lobby-balance">0</span>
                    </div>
                </div>
            </div>
        </header>

        <section class="lobby-banner" aria-label="Promotions">
            <img class="lobby-banner__img" src="../asset/image/lobby/banner-big.png" alt="Play More Win More">
            <div class="lobby-banner__dots" aria-hidden="true">
                <span class="is-active"></span>
                <span></span>
                <span></span>
            </div>
        </section>

        <section class="lobby-games" id="lobby-games">
            <div class="lobby-games__head">
                <h2 class="lobby-games__title">Slot Machines</h2>
                <button type="button" class="lobby-games__see-all">See all</button>
            </div>

            <div class="lobby-games__rows" id="lobby-games-list">
                <div class="lobby-games__scroll">
                    <ul class="lobby-games__list lobby-games__list--row1">
                        <li class="lobby-game-card" data-game="1">
                            <img class="lobby-game-card__poster" src="../asset/image/lobby/poster_game1.png" alt="Game 1">
                        </li>
                        <li class="lobby-game-card" data-game="2">
                            <img class="lobby-game-card__poster" src="../asset/image/lobby/poster_game2.png" alt="Game 2">
                        </li>
                        <li class="lobby-game-card" data-game="3">
                            <img class="lobby-game-card__poster" src="../asset/image/lobby/poster_game3.png" alt="Game 3">
                        </li>
                        <li class="lobby-game-card" data-game="4">
                            <img class="lobby-game-card__poster" src="../asset/image/lobby/poster_game4.png" alt="Game 4">
                        </li>
                        <li class="lobby-game-card" data-game="5">
                            <img class="lobby-game-card__poster" src="../asset/image/lobby/poster_game5.png" alt="Game 5">
                        </li>
                        <li class="lobby-game-card" data-game="11">
                            <img class="lobby-game-card__poster" src="../asset/image/lobby/poster_game11.png" alt="Game 11">
                        </li>
                    </ul>
                </div>

                <div class="lobby-games__scroll">
                    <ul class="lobby-games__list lobby-games__list--row2">
                        <li class="lobby-game-card" data-game="6">
                            <img class="lobby-game-card__poster" src="../asset/image/lobby/poster_game6.png" alt="Game 6">
                        </li>
                        <li class="lobby-game-card" data-game="7">
                            <img class="lobby-game-card__poster" src="../asset/image/lobby/poster_game7.png" alt="Game 7">
                        </li>
                        <li class="lobby-game-card" data-game="8">
                            <img class="lobby-game-card__poster" src="../asset/image/lobby/poster_game8.png" alt="Game 8">
                        </li>
                        <li class="lobby-game-card" data-game="9">
                            <img class="lobby-game-card__poster" src="../asset/image/lobby/poster_game9.png" alt="Game 9">
                        </li>
                        <li class="lobby-game-card" data-game="10">
                            <img class="lobby-game-card__poster" src="../asset/image/lobby/poster_game10.png" alt="Game 10">
                        </li>
                    </ul>
                </div>
            </div>
        </section>
    </div>

    <footer class="lobby-footer" id="lobby-footer">
        <button type="button" class="lobby-footer__play" id="lobby-play-game">
            <span class="lobby-play-btn">
                <img class="lobby-play-btn__bg" src="../asset/image/lobby/button_play.png" alt="">
                <img class="lobby-play-btn__text" src="../asset/image/lobby/text_playgame.png" alt="Play Game">
            </span>
        </button>
    </footer>

    <script src="../asset/js/lobby.js"></script>
</body>
</html>
