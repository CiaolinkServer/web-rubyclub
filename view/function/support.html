<div class="support-overlay" id="support-overlay" aria-hidden="true">
    <div class="support" role="dialog" aria-modal="true" aria-labelledby="support-title">
        <button type="button" class="support__close" id="support-close" aria-label="Đóng">
            <span aria-hidden="true">&times;</span>
        </button>

        <h2 class="support__title" id="support-title">SUPPORT</h2>

        <div class="support__panel">
            <a class="support__item" id="support-messenger" href="#" target="_blank" rel="noopener noreferrer" 
                onclick="openFacebookSupport()">
                <img class="support__icon" src="/assets/image/function/support/icon_message.png" alt="">
                <span class="support__label">MESSENGER</span>
            </a>
            <a class="support__item" id="support-telegram" href="#" target="_blank" rel="noopener noreferrer" onclick="openTelegramSupport()">
                <img class="support__icon" src="/assets/image/function/support/icon_telegram.png" alt="">
                <span class="support__label">TELEGRAM</span>
            </a>
        </div>
    </div>
</div>
