<div class="maildetail-overlay" id="maildetail-overlay" aria-hidden="true">
    <div class="maildetail" role="dialog" aria-modal="true" aria-labelledby="maildetail-title">
        <button type="button" class="maildetail__close" id="maildetail-close" aria-label="Close">
            <span aria-hidden="true">&times;</span>
        </button>

        <h2 class="maildetail__heading" id="maildetail-title"></h2>

        <div class="maildetail__panel">
            <div class="maildetail__reward" id="maildetail-reward">
                <img class="maildetail__coin" id="maildetail-coin" src="/assets/image/function/mail/icon_coin.png" alt="">
                <span class="maildetail__amount" id="maildetail-amount"></span>
            </div>

            <div class="maildetail__body">
                <p class="maildetail__content" id="maildetail-content"></p>
            </div>

            <button type="button" class="maildetail__receive" id="maildetail-receive">Receive</button>
        </div>
    </div>
</div>
