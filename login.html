<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Ruby Club - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="asset/css/login.css">
</head>
<body class="login-page">
    <main class="login-screen">
        <div class="login-logo">
            <img src="asset/image/login/logo.png" alt="Ruby Club">
        </div>

        <nav class="login-actions">
            <button type="button" class="login-btn" id="btn-guest" data-action="guest">
                <img class="login-btn__bg" src="asset/image/login/logint_guest.png" alt="">
                <span class="login-btn__text">Play Guest</span>
            </button>

            <button type="button" class="login-btn" id="btn-google" data-action="google">
                <img class="login-btn__bg" src="asset/image/login/button_loginGoogle.png" alt="">
                <span class="login-btn__text">Login with Google</span>
            </button>

            <button type="button" class="login-btn" id="btn-id" data-action="id">
                <img class="login-btn__bg" src="asset/image/login/button_login_Id.png" alt="">
                <span class="login-btn__text">Login ID</span>
            </button>
        </nav>
    </main>

    <script src="asset/js/login.js"></script>
</body>
</html>
