                <img class="login1-banner__img" id="login1-banner-img" src="assets/image/banner/banner_ngang/welcome_ngang.png" alt="Promotion">

        <section class="login1-actions" id="login1-actions" aria-label="Login">
            <div class="login1-actions__auth" id="login1-actions-auth">
                <button type="button" class="login1-actions__btn login1-actions__btn--login" id="btn-login">
                    <img class="login1-actions__btn-icon" src="assets/image/login1/icon_login.png" alt="">
                    <span class="login1-actions__btn-label">Login</span>
                </button>
                <button type="button" class="login1-actions__btn login1-actions__btn--signin" id="btn-signin">
                    <img class="login1-actions__btn-icon" src="assets/image/login1/icon_signin.png" alt="">
                    <span class="login1-actions__btn-label">Signin</span>
                </button>
            </div>
            <div class="login1-actions__user" id="login1-actions-user" hidden>
                <div class="login1-actions__user-card">
                    <div class="login1-actions__user-top">
                        <span class="login1-actions__balance" id="login1-balance">0</span>
                        <button type="button" class="login1-actions__refresh" id="login1-refresh-balance" aria-label="Refresh balance">
                            <img src="assets/image/login1/icon_refresh.png" alt="">
                        </button>
                    </div>
                    <p class="login1-actions__greeting">Hi, <span id="login1-username">Player</span></p>
                </div>
            </div>
            <div class="login1-actions__quick">
                <img class="login1-actions__quick-bg" src="assets/image/login1/background_menu_fake.png" alt="" aria-hidden="true">
                <nav class="login1-actions__quick-nav" aria-label="Utilities">
                    <button type="button" class="login1-actions__quick-item" onclick="showToast('Coming soon')">
                        <img class="login1-actions__quick-icon" src="assets/image/login1/icon_payback.png" alt="">
                        <span class="login1-actions__quick-label">Pay back</span>
                    </button>
                    <button type="button" class="login1-actions__quick-item" id="btn-shortcut">
                        <img class="login1-actions__quick-icon" src="assets/image/login1/icon_shortcut.png" alt="">
                        <span class="login1-actions__quick-label">Shortcut</span>
                    </button>
                    <button type="button" class="login1-actions__quick-item" onclick="showToast('Coming soon')">
                        <img class="login1-actions__quick-icon" src="assets/image/login1/icon_apk.png" alt="">
                        <span class="login1-actions__quick-label">APK</span>
                    </button>
                    <button type="button" class="login1-actions__quick-item" id="btn-support">
                        <img class="login1-actions__quick-icon" src="assets/image/login1/icon_support.png" alt="">
                        <span class="login1-actions__quick-label">Support</span>
                    </button>
                </nav>
            </div>
        </section>

        <div class="login1-body">
            <aside class="login1-sidebar" aria-label="Game categories">
                <nav class="login1-sidebar__nav">
                    <button type="button" class="login1-sidebar__item login1-sidebar__item--active" data-game-filter="all">
                        <img class="login1-sidebar__icon" src="assets/image/login1/icon_menudoc_allgame_selected.png" data-icon="assets/image/login1/icon_menudoc_allgame.png" data-icon-active="assets/image/login1/icon_menudoc_allgame_selected.png" alt="">
                        <span class="login1-sidebar__label">ALL GAME</span>
                    </button>
                    <button type="button" class="login1-sidebar__item" data-game-filter="hot">
                        <img class="login1-sidebar__icon" src="assets/image/login1/icon_menudoc_hotgame.png" data-icon="assets/image/login1/icon_menudoc_hotgame.png" data-icon-active="assets/image/login1/icon_menudoc_hotgame_selected.png" alt="">
                        <span class="login1-sidebar__label">HOT GAME</span>
                    </button>
                    <button type="button" class="login1-sidebar__item" data-game-filter="hall_of_fame">
                        <img class="login1-sidebar__icon" src="assets/image/login1/icon_menudoc_hall_of_fame.png" data-icon="assets/image/login1/icon_menudoc_hall_of_fame.png" data-icon-active="assets/image/login1/icon_menudoc_hall_of_fame_selected.png" alt="">
                        <span class="login1-sidebar__label">HALL OF FAME</span>
                    </button>
                    <button type="button" class="login1-sidebar__item" data-game-filter="new">
                        <img class="login1-sidebar__icon" src="assets/image/login1/icon_menudoc_new_game.png" data-icon="assets/image/login1/icon_menudoc_new_game.png" data-icon-active="assets/image/login1/icon_menudoc_new_game_selected.png" alt="">
                        <span class="login1-sidebar__label">NEW</span>
                    </button>
                    <button type="button" class="login1-sidebar__item" data-game-filter="bigwin">
                        <img class="login1-sidebar__icon" src="assets/image/login1/icon_menudoc_bigwin.png" data-icon="assets/image/login1/icon_menudoc_bigwin.png" data-icon-active="assets/image/login1/icon_menudoc_bigwin_selected.png" alt="">
                        <span class="login1-sidebar__label">BIG WIN</span>
                    </button>
                    <button type="button" class="login1-sidebar__item" data-game-filter="bonus_rich">
                        <img class="login1-sidebar__icon" src="assets/image/login1/icon_menudoc_bonus_rich.png" data-icon="assets/image/login1/icon_menudoc_bonus_rich.png" data-icon-active="assets/image/login1/icon_menudoc_bonus_rich_selected.png" alt="">
                        <span class="login1-sidebar__label">BONUS RICH</span>
                    </button>
                </nav>
            </aside>

            <section class="login1-games" id="login1-games" aria-label="Game list">
                <ul class="login1-games__grid"></ul>
            </section>
        </div>
